name: Step 4 # Last step of the exercise

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

env:
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  find_exercise:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-author: github-actions[bot]
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check compiled fixer workflow references Copilot secret
        id: check-copilot-secret
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.lock.yml
          keyphrase: COPILOT_GITHUB_TOKEN

      - name: Run Mona's Issue Triage API tests on main
        id: check-build-green
        continue-on-error: true
        timeout-minutes: 10
        run: |
          cd app
          npm ci
          npm test

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 4
            results_table:
              - description: "Checked that autofix-ci.lock.yml references COPILOT_GITHUB_TOKEN for the stacked fixer"
                passed: ${{ steps.check-copilot-secret.outcome == 'success' }}
              - description: "Ran cd app && npm ci && npm test on main after PR 5 merged to confirm the stacked fix kept Mona's Issue Triage API green"
                passed: ${{ steps.check-build-green.outcome == 'success' }}

      - name: Create comment - merged fix still needs work
        if: steps.check-build-green.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$ISSUE_REPOSITORY" --body "The final Step 4 check ran \`cd app && npm ci && npm test\` on \`main\`, but Mona's Issue Triage API tests did not pass yet. Review the results table above, re-run or re-merge the \`autofix-ci\` workflow's pull request with a passing fix, then run Step 4 again."

      - name: Fail job if the merged fix did not pass
        if: contains(steps.*.outcome, 'failure')
        run: |
          echo "The merged fix did not pass the final checks yet. Re-run or re-merge the autofix-ci workflow's pull request, then run Step 4 again."
          exit 1

  post_review_content:
    name: Post review content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished - final review next
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Disable current workflow
        run: gh workflow disable "${{github.workflow}}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finish_exercise:
    name: Finish Exercise
    needs: [find_exercise, post_review_content]
    uses: skills/exercise-toolkit/.github/workflows/finish-exercise.yml@v0.9.3
    with:
      issue-url: ${{ needs.find_exercise.outputs.issue-url }}
      exercise-title: "Agentic Workflows That Fix the Build"

  disable_generated_workflow:
    name: Disable generated fixer workflow
    needs: [find_exercise, finish_exercise]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Disable autofix-ci workflow after issue closure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue_state="$(gh issue view "$ISSUE_NUMBER" --repo "$ISSUE_REPOSITORY" --json state --jq .state)"
          if [ "$issue_state" != "CLOSED" ]; then
            echo "Exercise issue is not closed yet; skipping fixer workflow disable."
            exit 0
          fi

          workflow_ids="$(gh workflow list --repo "$ISSUE_REPOSITORY" --all --json id,name,path --jq '.[] | select(
            (.name == "autofix-ci") or
            (.name == "Fix Build") or
            ((.path // "") | endswith("/autofix-ci.lock.yml")) or
            ((.path // "") | endswith("/autofix-ci.yml"))
          ) | .id')"

          if [ -z "$workflow_ids" ]; then
            echo "No generated fixer workflow found to disable."
            exit 0
          fi

          while IFS= read -r workflow_id; do
            [ -z "$workflow_id" ] && continue
            gh workflow disable "$workflow_id" --repo "$ISSUE_REPOSITORY"
            echo "Disabled workflow id: $workflow_id"
          done <<< "$workflow_ids"
