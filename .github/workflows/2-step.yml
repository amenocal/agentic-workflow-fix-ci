name: Step 2

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  actions: write
  issues: write

env:
  STEP_3_FILE: ".github/steps/3-step.md"

jobs:
  find_exercise:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Find Exercise Issue
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.3

  check_step_work:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    name: Check step work
    runs-on: ubuntu-latest
    needs: [find_exercise]
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Find last comment
        id: find-last-comment
        uses: peter-evans/find-comment@v4
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          direction: last

      - name: Update comment - checking work
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          file: exercise-toolkit/markdown-templates/step-feedback/checking-work.md
          edit-mode: replace

      - name: Check fixer workflow file exists
        id: check-fixer-workflow-file
        continue-on-error: true
        uses: skills/exercise-toolkit/actions/file-exists@v0.9.3
        with:
          file: .github/workflows/autofix-ci.md

      - name: Check fixer lock file exists
        id: check-fixer-lock-file
        continue-on-error: true
        uses: skills/exercise-toolkit/actions/file-exists@v0.9.3
        with:
          file: .github/workflows/autofix-ci.lock.yml

      - name: Check workflow uses safe outputs
        id: check-workflow-safe-outputs
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: safe-outputs

      - name: Check workflow creates pull requests
        id: check-workflow-create-pr
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: create-pull-request

      - name: Check workflow filters failed conclusions
        id: check-workflow-conclusion
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: conclusion

      - name: Check workflow runs on CI completion
        id: check-workflow-run-trigger
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: workflow_run

      - name: Check workflow restricts PR base branches
        id: check-workflow-allowed-base-branches
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: allowed-base-branches

      - name: Check workflow can run manually
        id: check-workflow-dispatch-trigger
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: workflow_dispatch

      - name: Check workflow declares network access
        id: check-workflow-network
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: network

      - name: Check workflow references CI
        id: check-workflow-ci
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: CI

      - name: Check workflow reads Mona notes
        id: check-workflow-notes
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.md
          keyphrase: notes/ci-fix-guide.md

      - name: Check lock file references Copilot token
        id: check-lock-token
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/workflows/autofix-ci.lock.yml
          keyphrase: COPILOT_GITHUB_TOKEN

      - name: Check agent instructions include no auto-compile rule
        id: check-agent-no-compile
        continue-on-error: true
        uses: skills/action-keyphrase-checker@v2
        with:
          text-file: .github/agents/agentic-workflows.md
          keyphrase: Only create or update the markdown workflow file.

      - name: Update comment - step results
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          comment-id: ${{ steps.find-last-comment.outputs.comment-id }}
          edit-mode: replace
          file: exercise-toolkit/markdown-templates/step-feedback/step-results-table.md
          vars: |
            step_number: 2
            results_table:
              - description: "Checked for .github/workflows/autofix-ci.md"
                passed: ${{ steps.check-fixer-workflow-file.outcome == 'success' }}
              - description: "Checked for .github/workflows/autofix-ci.lock.yml"
                passed: ${{ steps.check-fixer-lock-file.outcome == 'success' }}
              - description: "Checked that autofix-ci.md uses safe-outputs"
                passed: ${{ steps.check-workflow-safe-outputs.outcome == 'success' }}
              - description: "Checked that autofix-ci.md uses create-pull-request"
                passed: ${{ steps.check-workflow-create-pr.outcome == 'success' }}
              - description: "Checked that autofix-ci.md filters failed conclusions"
                passed: ${{ steps.check-workflow-conclusion.outcome == 'success' }}
              - description: "Checked that autofix-ci.md uses workflow_run"
                passed: ${{ steps.check-workflow-run-trigger.outcome == 'success' }}
              - description: "Checked that autofix-ci.md restricts PR base branches"
                passed: ${{ steps.check-workflow-allowed-base-branches.outcome == 'success' }}
              - description: "Checked that autofix-ci.md uses workflow_dispatch"
                passed: ${{ steps.check-workflow-dispatch-trigger.outcome == 'success' }}
              - description: "Checked that autofix-ci.md declares network access"
                passed: ${{ steps.check-workflow-network.outcome == 'success' }}
              - description: "Checked that autofix-ci.md references the CI workflow"
                passed: ${{ steps.check-workflow-ci.outcome == 'success' }}
              - description: "Checked that autofix-ci.md reads notes/ci-fix-guide.md"
                passed: ${{ steps.check-workflow-notes.outcome == 'success' }}
              - description: "Checked that autofix-ci.lock.yml references COPILOT_GITHUB_TOKEN"
                passed: ${{ steps.check-lock-token.outcome == 'success' }}
              - description: "Checked that the agent instructions include the no auto-compile rule"
                passed: ${{ steps.check-agent-no-compile.outcome == 'success' }}

      - name: Fail job if not all checks passed
        if: contains(steps.*.outcome, 'failure')
        run: exit 1

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise, check_step_work]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get response templates
        uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.3

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 3"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
